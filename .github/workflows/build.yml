# PXE Lab Installer: test on every push, build installers, release on tag.
#   macOS   : PXE-Lab-Installer-<ver>-arm64.dmg / -x64.dmg
#   Windows : PXE-Lab-Installer-Setup-<ver>.exe
#   push / PR -> tests (Linux/macOS/Windows) + build; files kept as artifacts
#   tag vX.Y.Z, or "Run workflow" with release=true -> GitHub Release with all files + SHA-256
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release (tag vX.Y.Z from package.json version)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Version check
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != v$V"; exit 1; }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   id: macos,   script: "dist:mac" }
          - { os: windows-latest, id: windows, script: "dist:win" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds
      - name: Checksums
        shell: python
        run: |
          import hashlib, pathlib
          out = pathlib.Path("dist")
          for f in sorted(out.iterdir()):
              if f.suffix in (".dmg", ".exe"):
                  d = hashlib.sha256(f.read_bytes()).hexdigest()
                  (out / (f.name + ".sha256")).write_text(f"{d}  {f.name}\n")
                  print(d, f.name)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.sha256
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Releasing $TAG at $GITHUB_SHA"; ls -l dist
          # a published version is immutable: never replace an existing release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version in package.json (semver) and CHANGELOG.md instead of overwriting it."; exit 1
          fi
          # release notes = this version's section of CHANGELOG.md
          V="${TAG#v}"
          awk -v v="$V" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no entry for $V"; exit 1; }
          printf '\nApps are unsigned: on macOS run xattr -cr "/Applications/PXE Lab Installer.app" once; on Windows choose More info > Run anyway.\n' >> notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PXE Lab Installer $TAG" --notes-file notes.md
